[package]
name = "rsync"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
notify = "8"
rayon = "1"
rcgen = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.9"
walkdir = "2"

